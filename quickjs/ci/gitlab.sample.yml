# Sample ONLY. Admin provisions and SHA256-pins Dairn CI runtime under /opt/dairn
# OUTSIDE of the untrusted MR checkout. Protected CI variables (not PR YAML):
# DAIRN_EXPECTED_POLICY_SHA256, trusted Dairn binary digest, trusted base SHA.
# The required job/stage must be enforced by protected SCM settings.
# No AI model or BusyBox is required in CI; project build tools remain necessary.
stages:
  - quality

dairn-quality:
  stage: quality
  variables:
    GIT_DEPTH: "0"
  script:
    - test -n "$DAIRN_EXPECTED_POLICY_SHA256"
    - test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - test -x /opt/dairn/dairn.sh
    - /opt/dairn/dairn.sh validate --root "$CI_PROJECT_DIR" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - /opt/dairn/dairn.sh guide impact --root "$CI_PROJECT_DIR" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - /opt/dairn/dairn.sh check --root "$CI_PROJECT_DIR" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  artifacts:
    when: always
    paths:
      - .dairn/governance/evidence/
# Do not infer that a SHA256 digest file generated by the PR constitutes
# CI signing or human approval. Supply protected issuer/workflow attestations separately.
