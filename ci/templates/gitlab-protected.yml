# REVIEWED TEMPLATE: Requires pinned /opt/dairn runtime, separated runner groups.
# Merge requests use an unprivileged quality job; ONLY protected push jobs sign.
# CI chain is Task-independent (architecture Q4); publisher holds no signing key.
stages: [quality, attestation]

# GitLab PR jobs usually cannot access protected variables: read policy pins from
# provisioned *public, read-only runner configuration* rather than PR files.
dairn:pr-quality:
  stage: quality
  tags: [dairn-unprivileged]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  variables:
    GIT_DEPTH: "0"
  script:
    - export DAIRN_EXPECTED_POLICY_SHA256="$(cat /etc/dairn/trusted-policy.sha256)"
    - test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - /opt/dairn/dairn.sh validate --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - /opt/dairn/dairn.sh check --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# No signing key on this runner, despite operating on a protected commit.
dairn:protected-build:
  stage: quality
  tags: [dairn-protected-build]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  variables:
    GIT_DEPTH: "0"
  script:
    - export DAIRN_CI_BIN=/opt/dairn/dairn.sh DAIRN_CI_APE_PATH=/opt/dairn/runtime/dairn-embedded.com
    - export DAIRN_TRUSTED_BASE_REF="${DAIRN_TRUSTED_BASE_REF:-HEAD^}"
    - /opt/dairn/ci/protected/build-protected.sh "$DAIRN_TRUSTED_BASE_REF"
  artifacts:
    when: on_success
    paths:
      - .dairn/governance/evidence/

# Separate protected signing runner; key mounted ONLY here, not as a protected
# pipeline-wide variable. Never execute project tests or project Stubs here.
dairn:sign:
  stage: attestation
  tags: [dairn-protected-sign]
  needs:
    - job: dairn:protected-build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  variables:
    GIT_DEPTH: "0"
  script:
    - export DAIRN_CI_BIN=/opt/dairn/dairn.sh DAIRN_CI_APE_PATH=/opt/dairn/runtime/dairn-embedded.com
    - export DAIRN_SIGNING_PRIVATE_KEY_PATH=/run/secrets/dairn-ci-ed25519.pem
    - export DAIRN_TRUSTED_CI_PUBLIC_KEY=/etc/dairn/ci-ed25519-public.pem
    - export DAIRN_EVIDENCE_DIR="$CI_PROJECT_DIR/.dairn/governance/evidence"
    - /opt/dairn/ci/protected/sign-protected.sh
  artifacts:
    when: on_success
    paths:
      - .dairn/governance/evidence/

# Keyless publisher: dedicated identity may write ONLY refs/heads/dairn-evidence.
# It re-verifies every signed byte, appends fast-forward only, and reads back.
dairn:publish-evidence:
  stage: attestation
  tags: [dairn-evidence-publisher]
  needs:
    - job: dairn:sign
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  variables:
    GIT_DEPTH: "0"
  script:
    - export DAIRN_CI_BIN=/opt/dairn/dairn.sh
    - export DAIRN_TRUSTED_CI_PUBLIC_KEY=/etc/dairn/ci-ed25519-public.pem
    - export DAIRN_EVIDENCE_DIR="$CI_PROJECT_DIR/.dairn/governance/evidence"
    - export DAIRN_EVIDENCE_REF_NAME="${DAIRN_EVIDENCE_REF_NAME:-refs/heads/dairn-evidence}"
    - /opt/dairn/ci/protected/publish-evidence.sh
