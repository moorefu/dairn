name: 自举打包与跨平台制品验证

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 标签推送时版本以标签为准；没有标签的 CI 运行回退 package.json。
  DAIRN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: 获取现成 QuickJS 并自举三类制品
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .build/quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('quickjs.lock.json') }}
      - name: 下载校验 QuickJS、自举嵌入并打包
        run: |
          python tools/build.py
          npm run build
          python tools/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: dairn-packages
          path: |
            dist/*.tgz
            dist/*.whl
            dist/*.zip
            dist/checksums.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: 冒烟验证 ${{ matrix.package }} / ${{ matrix.runner }}
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [npm, wheel, zip]
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.package == 'npm'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 安装、版本、初始化与结构校验
        run: python -B -X utf8 tools/verify-packages.py --smoke --artifacts incoming --package ${{ matrix.package }} --out validation/runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}-${{ matrix.package }}
          path: validation/runner/
          if-no-files-found: error

  accepted:
    name: 全部矩阵通过
    if: always()
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: 必须全部成功
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  publish:
    name: 发布版本与 latest 三类制品
    needs: [build, test, accepted]
    # 只有推送 v<package.json 版本> 标签才发布；普通分支推送和手动运行只做构建验证。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: dairn-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 校验制品并发布版本与 latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 以 checkout 后的提交为准，避免标签推送时 GITHUB_SHA 指向 tag 对象而非提交。
        run: python tools/publish-release.py --artifacts incoming --commit "$(git rev-parse HEAD)"
