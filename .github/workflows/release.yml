name: 源码构建与跨平台制品验证

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      quickjs_version:
        description: QuickJS 官方源码版本
        default: '2026-06-04'
        type: string
      source_sha256:
        description: 新版本必填的源码 SHA256（锁文件已有版本可留空）
        default: ''
        type: string
      source_url:
        description: 可选源码 URL（默认 Bellard 对应版本的 tar.xz）
        default: ''
        type: string
      cosmocc_version:
        description: 补丁匹配的 Cosmopolitan 工具链版本
        default: '4.0.2'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 从官方源码构建同一套制品
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载、校验、补丁、编译和嵌入
        shell: bash
        env:
          QJS_VERSION: ${{ inputs.quickjs_version || '2026-06-04' }}
          QJS_SHA256: ${{ inputs.source_sha256 }}
          QJS_URL: ${{ inputs.source_url }}
          COSMO_VERSION: ${{ inputs.cosmocc_version || '4.0.2' }}
        run: >-
          python tools/build-runtime.py
          --quickjs-version "$QJS_VERSION"
          --source-sha256 "$QJS_SHA256"
          --source-url "$QJS_URL"
          --cosmocc-version "$COSMO_VERSION"
      - name: 构建 npm、Wheel 和运行 ZIP
        run: |
          python tools/build.py
          npm run build
          python tools/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: dairn-packages
          path: |
            dist/*.tgz
            dist/*.whl
            dist/*.zip
            dist/checksums.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: 冒烟验证 ${{ matrix.package }} / ${{ matrix.runner }}
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [npm, wheel, zip]
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.package == 'npm'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 安装、版本、初始化与结构校验
        run: python -B -X utf8 tools/verify-packages.py --smoke --artifacts incoming --package ${{ matrix.package }} --out validation/runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}-${{ matrix.package }}
          path: validation/runner/
          if-no-files-found: error

  accepted:
    name: 全部矩阵通过
    if: always()
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: 必须全部成功
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
