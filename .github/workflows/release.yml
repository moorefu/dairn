name: 自举打包与跨平台制品验证

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 标签推送时版本以标签为准；没有标签的 CI 运行按构建时间生成 nightly（基础版本取 package.json）。
  DAIRN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: 获取现成 QuickJS 并自举三类制品
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_time: ${{ steps.stamp.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .build/quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('quickjs.lock.json') }}
      - name: 固定本轮构建时间
        id: stamp
        run: |
          # 无标签构建时 nightly 版本取构建时间；同一 job 的 Python、npm 与校验清单共用该时间戳。
          build_time="$(python tools/nightly-version.py --instant)"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "本轮构建时间：$build_time"
      - name: 下载校验 QuickJS、自举嵌入并打包
        env:
          DAIRN_BUILD_TIME: ${{ steps.stamp.outputs.build_time }}
        run: |
          python tools/build.py
          npm run build
          python tools/checksums.py
      - name: 分发资产与检索回归（隔离候选）
        run: python tools/with-built-runtime.py --from-zip dist -- python -B tools/check-source.py lint
      - uses: actions/upload-artifact@v4
        with:
          name: dairn-packages
          path: |
            dist/*.tgz
            dist/*.whl
            dist/*.zip
            dist/checksums.json
          if-no-files-found: error
          retention-days: 14
      - name: 保存锁定的 QuickJS 测试引导工具
        uses: actions/upload-artifact@v4
        with:
          name: dairn-quickjs-bootstrap
          path: .build/quickjs/qjs-*.com
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test:
    name: 冒烟验证 ${{ matrix.runner }}（npm、Wheel、ZIP）
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      # 一个 runner 一次验收三类制品，矩阵只需覆盖平台，不再按制品拆分。
      - name: 安装、版本、初始化与结构校验
        run: python -B -X utf8 tools/verify-packages.py --smoke --artifacts incoming --out validation/runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: validation/runner/
          if-no-files-found: error

  test-python:
    name: Python 集成回归（Linux 套件）
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('quickjs.lock.json') }}
          restore-keys: go-build-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: Python 集成回归（Linux 隔离候选）
        run: python -B -X utf8 tools/with-built-runtime.py --from-zip incoming -- python -B -X utf8 tools/verify-linux.py validation/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-ci
          path: |
            validation/ci/
            validation/source-checks/
            validation/runtime-builds/
          if-no-files-found: error

  test-python-windows:
    name: Python 集成回归（Windows 套件）
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 预置离线源码测试需要的锁定 QuickJS
        uses: actions/download-artifact@v4
        with:
          name: dairn-quickjs-bootstrap
          path: .build/quickjs
      - name: Python 集成回归（Windows 隔离候选）
        env:
          DAIRN_OFFLINE: '1'
        run: python -B -X utf8 tools/with-built-runtime.py --from-zip incoming -- python -B -X utf8 tools/verify-windows.py --artifacts incoming --skip-go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows-integration
          path: |
            validation/windows/
            validation/source-checks/
            validation/runtime-builds/
          if-no-files-found: error

  accepted:
    name: 全部矩阵通过
    if: always()
    needs: [build, test, test-python, test-python-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: 必须全部成功
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_PYTHON_RESULT: ${{ needs.test-python.result }}
          TEST_PYTHON_WINDOWS_RESULT: ${{ needs.test-python-windows.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success && test "$TEST_PYTHON_RESULT" = success && test "$TEST_PYTHON_WINDOWS_RESULT" = success

  publish:
    name: 发布版本与 latest 三类制品
    needs: [build, test, accepted]
    # 只有推送 v<版本> 标签才发布；普通分支推送和手动运行只做构建验证。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: dairn-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 校验制品并发布版本与 latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 以 checkout 后的提交为准，避免标签推送时 GITHUB_SHA 指向 tag 对象而非提交。
        run: python tools/publish-release.py --artifacts incoming --commit "$(git rev-parse HEAD)"
