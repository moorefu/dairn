name: 自举打包与跨平台制品验证

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 标签推送时版本以标签为准；没有标签的 CI 运行回退 package.json。
  DAIRN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: 获取现成 QuickJS 并自举三类制品
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .build/quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('quickjs.lock.json') }}
      - name: 下载校验 QuickJS、自举嵌入并打包
        run: |
          python tools/build.py
          npm run build
          python tools/checksums.py
      - name: 分发资产一致性（Skill/Spec 命令）
        env:
          # 构建任务刚生成 runtime/；按构建产物的语义显式指定，避免走 vendored 快照。
          DAIRN_RUNTIME: ${{ github.workspace }}/runtime/dairn-embedded.com
        run: sh ./dairn.sh docs check
      - name: 分发资产与 docs find 回归
        run: python -B -X utf8 -m unittest quickjs.tests.test_assets_lint -v
      - uses: actions/upload-artifact@v4
        with:
          name: dairn-packages
          path: |
            dist/*.tgz
            dist/*.whl
            dist/*.zip
            dist/checksums.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: 冒烟验证 ${{ matrix.runner }}（npm、Wheel、ZIP）
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      # 一个 runner 一次验收三类制品，矩阵只需覆盖平台，不再按制品拆分。
      - name: 安装、版本、初始化与结构校验
        run: python -B -X utf8 tools/verify-packages.py --smoke --artifacts incoming --out validation/runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: validation/runner/
          if-no-files-found: error

  test-python:
    name: Python 集成回归（Linux 套件）
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('quickjs.lock.json') }}
          restore-keys: go-build-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 从发布 ZIP 提取运行时
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          candidates = glob.glob('incoming/*.zip')
          assert len(candidates) == 1, candidates
          with zipfile.ZipFile(candidates[0]) as zipped:
              runtime = [name for name in zipped.namelist()
                         if name.endswith('/runtime/dairn-embedded.com')]
              integrity = [name for name in zipped.namelist()
                           if name.endswith('/runtime/runtime-integrity.json')]
              assert len(runtime) == 1 and len(integrity) == 1, (runtime, integrity)
              target = pathlib.Path('runtime')
              target.mkdir(parents=True, exist_ok=True)
              (target / 'dairn-embedded.com').write_bytes(zipped.read(runtime[0]))
              (target / 'runtime-integrity.json').write_bytes(zipped.read(integrity[0]))
          PY
          chmod +x runtime/dairn-embedded.com dairn.sh ci/protected/*.sh
          jq --version >/dev/null && openssl version >/dev/null && sha256sum --version >/dev/null
      - name: Python 集成回归（Linux 套件）
        # verify-linux.py 会清除 CI 平台变量，模拟本地开发者环境；
        # 这里不再覆盖 GITHUB_*（GitHub 默认变量不可覆盖，且脚本已内建清洗）。
        run: python -B -X utf8 tools/verify-linux.py validation/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-ci
          path: validation/ci/
          if-no-files-found: error

  test-python-windows:
    name: Python 集成回归（Windows 套件）
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 从发布 ZIP 提取运行时
        shell: pwsh
        run: |
          $code = @'
          import glob
          import pathlib
          import zipfile

          candidates = glob.glob('incoming/*.zip')
          assert len(candidates) == 1, candidates
          with zipfile.ZipFile(candidates[0]) as zipped:
              runtime = [name for name in zipped.namelist()
                         if name.endswith('/runtime/dairn-embedded.com')]
              integrity = [name for name in zipped.namelist()
                           if name.endswith('/runtime/runtime-integrity.json')]
              assert len(runtime) == 1 and len(integrity) == 1, (runtime, integrity)
              target = pathlib.Path('runtime')
              target.mkdir(parents=True, exist_ok=True)
              (target / 'dairn-embedded.com').write_bytes(zipped.read(runtime[0]))
              (target / 'runtime-integrity.json').write_bytes(zipped.read(integrity[0]))
          print('extracted runtime from release ZIP')
          '@
          $code | python -
      - name: Python 集成回归（Windows 套件）
        env:
          DAIRN_OFFLINE: '1'
        run: python -B -X utf8 tools/verify-windows.py --artifacts incoming --skip-go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows-integration
          path: validation/windows/
          if-no-files-found: error

  accepted:
    name: 全部矩阵通过
    if: always()
    needs: [build, test, test-python, test-python-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: 必须全部成功
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_PYTHON_RESULT: ${{ needs.test-python.result }}
          TEST_PYTHON_WINDOWS_RESULT: ${{ needs.test-python-windows.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success && test "$TEST_PYTHON_RESULT" = success && test "$TEST_PYTHON_WINDOWS_RESULT" = success

  publish:
    name: 发布版本与 latest 三类制品
    needs: [build, test, accepted]
    # 只有推送 v<版本> 标签才发布；普通分支推送和手动运行只做构建验证。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: dairn-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: dairn-packages
          path: incoming
      - name: 校验制品并发布版本与 latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 以 checkout 后的提交为准，避免标签推送时 GITHUB_SHA 指向 tag 对象而非提交。
        run: python tools/publish-release.py --artifacts incoming --commit "$(git rev-parse HEAD)"
