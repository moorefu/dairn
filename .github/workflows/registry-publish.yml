name: 发布到 npm 与 PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已通过矩阵验证并发布到 GitHub Release 的版本标签，例如 v0.1.0-rc.1
        required: true
      target:
        description: 发布目标注册表
        type: choice
        options: [both, npm, pypi]
        default: both

permissions:
  contents: read

jobs:
  npm:
    name: 发布 ${{ inputs.tag }} 到 npm
    if: inputs.target != 'pypi'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: 下载 GitHub Release 中已验证的 npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir incoming
      - name: 发布 tarball（预发布用 next，正式版用 latest）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          test -n "${NODE_AUTH_TOKEN:-}" || {
            echo '::error::缺少 NPM_TOKEN：创建 npm Granular Access Token（Publish 权限）并配置到仓库 Secrets'
            exit 1
          }
          # 绝对路径：npm 会把形如 owner/repo 的相对路径当成 GitHub 简写解析。
          tgz=$(ls "$PWD"/incoming/*.tgz)
          info=$(python3 -c "import json,tarfile,sys; p=json.load(tarfile.open(sys.argv[1]).extractfile('package/package.json')); print(p['name'], p['version'])" "$tgz")
          name=${info% *}
          version=${info#* }
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 已存在于 npm，跳过发布（版本不可覆盖）。"
            exit 0
          fi
          set +e
          output=$(npm publish "$tgz" --access public --tag "$tag" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | grep -m1 -i 'npm error' || printf '%s\n' "$output" | head -n 1)
            echo "::error::npm publish 失败（$name@$version）：$detail"
            case "$output" in
              *EOTP*|*"one-time password"*) echo '提示：账号开启了 2FA，请改用 Automation token，或为 Granular token 勾选 Bypass 2FA。' ;;
              *E401*|*uthenticat*) echo '提示：NPM_TOKEN 无效或已过期。' ;;
              *E403*|*orbidden*) echo '提示：NPM_TOKEN 缺少发布权限，或作用域/包名不匹配。' ;;
            esac
            exit "$code"
          fi

  pypi:
    name: 发布 ${{ inputs.tag }} 到 PyPI
    if: inputs.target != 'npm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 下载 GitHub Release 中已验证的 Wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist
      - name: 发布 Wheel
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -eu
          test -n "${TWINE_PASSWORD:-}" || {
            echo '::error::缺少 PYPI_TOKEN：创建 PyPI API token 并配置到仓库 Secrets'
            exit 1
          }
          wheel=$(ls "$PWD"/dist/*.whl)
          info=$(python3 -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; d=dict(l.split(': ',1) for l in z.read(m).decode().splitlines() if ': ' in l); print(d['Name'], d['Version'])" "$wheel")
          name=${info% *}
          version=${info#* }
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")" = "200" ]; then
            echo "$name $version 已存在于 PyPI，跳过上传（版本不可覆盖）。"
            exit 0
          fi
          python -m pip install --quiet --disable-pip-version-check twine
          set +e
          output=$(python -m twine upload --non-interactive "$wheel" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | grep -m1 -iE 'error|HTTPError' || printf '%s\n' "$output" | head -n 1)
            echo "::error::twine 上传失败（$name $version）：$detail"
            exit "$code"
          fi
